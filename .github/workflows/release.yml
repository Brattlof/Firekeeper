name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: Package and upload
    runs-on: ubuntu-latest

    # This repository's default workflow token is read-only, so creating the
    # release came back "Resource not accessible by integration" (403) even
    # though the zip had already been built. Granted here rather than by
    # loosening the repository-wide setting, so every other workflow stays
    # read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Builds the zip, substitutes @project-version@ in the .toc, creates the
      # GitHub release, and uploads to CurseForge and Wago when those secrets
      # exist. Without them it still produces a GitHub release.
      - name: Package addon
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
